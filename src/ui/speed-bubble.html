<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --card: #ffffff; --text: #1f2023; --muted: #6b6e76; --line: #d2d4d9; --hover: #eef0f3; --accent: #2563eb; --up: #7c3aed; --danger: #b42318; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --card: #2a2b2f; --text: #e7e8ea; --muted: #9a9ca3; --line: #3a3b40; --hover: #34353a; --accent: #60a5fa; --up: #a78bfa; --danger: #f97066; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font: 13px/1.3 "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; overflow: hidden; }
  #card { margin: 0 6px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,.16); padding: 14px 16px 16px; }
  h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 16px; }
  .k { color: var(--muted); font-size: 12px; }
  .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .down { color: var(--accent); } .upc { color: var(--up); }
  .sep { height: 1px; background: var(--line); margin: 4px -16px 14px; }
  .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 4px 0 12px; }
  .res .v { font-size: 22px; }
  .res .v small { display: block; margin-top: 2px; }
  .res .phase { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  button { width: 100%; height: 34px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); }
  .note { color: var(--muted); font-size: 11px; margin-top: 10px; text-align: center; }
  .err { color: var(--danger); font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="card">
  <h3>Vyťaženie</h3>
  <div class="grid">
    <div><div class="k">Procesor (Sova)</div><div class="v" id="cpu">–</div></div>
    <div><div class="k">Pamäť (Sova)</div><div class="v" id="mem">–</div></div>
    <div><div class="k">Sťahovanie (celé PC)</div><div class="v down" id="nd">–</div></div>
    <div><div class="k">Odosielanie (celé PC)</div><div class="v upc" id="nu">–</div></div>
  </div>
  <div class="sep"></div>
  <h3>Test rýchlosti internetu</h3>
  <div class="res">
    <div id="rp"><div class="k">Odozva</div><div class="v" id="ping">–</div></div>
    <div id="rd"><div class="k">Sťahovanie</div><div class="v down" id="dl">–</div></div>
    <div id="ru"><div class="k">Odosielanie</div><div class="v upc" id="ul">–</div></div>
  </div>
  <div class="err" id="err" hidden></div>
  <button id="go">Spustiť test</button>
  <div class="note" id="note">Meria cez servery Cloudflare, trvá asi 20 sekúnd.</div>
</div>
<script>
  const B = window.bubble;
  const $ = (s) => document.getElementById(s);
  const mbps = (bps) => {
    if (bps == null) return '–';
    const m = bps / 1e6;
    if (m < 0.1) return `${Math.round(bps / 1e3)} <small>kb/s</small>`;
    return `${(m < 10 ? m.toFixed(1) : Math.round(m)).toString().replace('.', ',')} <small>Mb/s</small>`;
  };
  let running = false;
  B.on('stats', (s, t) => {
    $('cpu').innerHTML = `${Math.round(s.cpu)} <small>%</small>`;
    $('mem').innerHTML = s.mem >= 1024 ? `${(s.mem / 1024).toFixed(1).replace('.', ',')} <small>GB</small>` : `${s.mem} <small>MB</small>`;
    $('nd').innerHTML = mbps(s.down);
    $('nu').innerHTML = mbps(s.up);
    running = t.running;
    const r = t.running ? t.progress || {} : t.result || {};
    $('ping').innerHTML = r.ping != null ? `${Math.round(r.ping)} <small>ms</small>` : '–';
    $('dl').innerHTML = mbps(t.running && r.phase === 'download' ? r.live : r.down);
    $('ul').innerHTML = mbps(t.running && r.phase === 'upload' ? r.live : r.up);
    const ph = t.running ? r.phase : '';
    $('rp').classList.toggle('phase', ph === 'ping' || !ph && false);
    $('rd').classList.toggle('phase', ph === 'download' || ph === 'ping-done');
    $('ru').classList.toggle('phase', ph === 'upload' || ph === 'download-done');
    $('go').textContent = t.running ? 'Zastaviť test' : t.result ? 'Spustiť znova' : 'Spustiť test';
    $('go').classList.toggle('ghost', t.running);
    $('err').hidden = !t.error;
    $('err').textContent = t.error || '';
    $('note').textContent = t.running ? 'Meranie prebieha…'
      : t.at ? `Posledný test: ${new Date(t.at).toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' })} · servery Cloudflare`
      : 'Meria cez servery Cloudflare, trvá asi 20 sekúnd.';
    B.size($('card').getBoundingClientRect().height + 12);
  });
  $('go').addEventListener('click', () => B.send(running ? 'cancel' : 'start'));
  B.on('shown', () => B.send('ready'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') B.close(); });
</script>
</body>
</html>
