<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --card: #ffffff; --text: #1f2023; --muted: #6b6e76; --line: #d2d4d9; --field: #ffffff; --accent: #2563eb; --danger: #b42318; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --card: #2a2b2f; --text: #e7e8ea; --muted: #9a9ca3; --line: #3a3b40; --field: #1f2023; --accent: #60a5fa; --danger: #f97066; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font: 13px/1.3 "Segoe UI", system-ui, sans-serif; color: var(--text); overflow: hidden; }
  #card { margin: 0 6px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 6px 16px rgba(0,0,0,.16); }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  label { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); }
  input, select { width: 100%; height: 30px; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line);
    border-radius: 6px; padding: 0 8px; outline: 0; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  button { font: inherit; height: 30px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--text); }
  button:hover { border-color: var(--accent); }
  #remove { margin-right: auto; color: var(--danger); }
  #done { background: var(--accent); border-color: var(--accent); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="card">
  <h1 id="head">Záložka pridaná</h1>
  <label>Názov <input id="title" spellcheck="false"></label>
  <label id="urlrow">Adresa <input id="url" spellcheck="false"></label>
  <label>Priečinok <select id="folder"></select></label>
  <div class="buttons">
    <button id="remove">Odstrániť</button>
    <button id="done">Hotovo</button>
  </div>
</div>
<script>
  const $ = (s) => document.getElementById(s);
  let cur = null;
  // prázdny názov záložky = na lište sa zobrazí len ikona stránky
  const value = () => ({ id: cur.id, title: $('title').value.trim() || (cur.type === 'folder' ? 'Priečinok' : ''),
    url: cur.type === 'url' ? $('url').value.trim() : undefined, parentId: $('folder').value });
  window.bm.onData((d) => {
    cur = d;
    $('head').textContent = d.mode === 'added' ? 'Záložka pridaná' : d.type === 'folder' ? 'Upraviť priečinok' : 'Upraviť záložku';
    $('title').value = d.title;
    $('url').value = d.url;
    $('urlrow').hidden = d.type !== 'url' || d.mode === 'added';
    const sel = $('folder');
    sel.innerHTML = '';
    for (const f of d.folders) {
      const o = document.createElement('option');
      o.value = f.id;
      o.textContent = '   '.repeat(f.depth) + f.title;
      sel.appendChild(o);
    }
    sel.value = d.parentId;
    requestAnimationFrame(() => {
      window.bm.height(document.getElementById('card').getBoundingClientRect().height + 12);
      $('title').focus();
      $('title').select();
    });
  });
  for (const id of ['title', 'url', 'folder']) $(id).addEventListener('input', () => cur && window.bm.draft(value()));
  $('folder').addEventListener('change', () => cur && window.bm.draft(value()));
  $('done').addEventListener('click', () => window.bm.done(value()));
  $('remove').addEventListener('click', () => window.bm.remove(cur.id));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName !== 'SELECT') { e.preventDefault(); window.bm.done(value()); }
    if (e.key === 'Escape') window.bm.cancel();
  });
</script>
</body>
</html>
