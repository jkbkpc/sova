<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Stiahnuté súbory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%20stroke%3D%22%232563eb%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M8%202.5v7.2M4.8%206.8%208%2010l3.2-3.2M2.8%2011.5v1a1%201%200%200%200%201%201h8.4a1%201%200%200%200%201-1v-1%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="common.css">
<style>
  .tools { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; display: flex; gap: 8px; align-items: center; }
  #search { flex: 1; height: 36px; border-radius: 18px; padding: 0 16px; font-size: 14px; }
  .day { font-size: 13px; font-weight: 600; margin: 18px 0 6px; padding: 0 4px; color: var(--muted); }
  .day:first-child { margin-top: 6px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 12px 10px 12px 14px; border-radius: 10px; }
  .item:hover { background: var(--hover); }
  .fi { width: 32px; height: 32px; flex: none; display: grid; place-items: center; }
  .fi img { width: 32px; height: 32px; }
  .fi svg { width: 26px; height: 26px; color: var(--muted); stroke-width: 1.3; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name a { color: var(--text); text-decoration: none; cursor: pointer; }
  .name a:hover { color: var(--accent); text-decoration: underline; }
  .item.bad .name { color: var(--muted); text-decoration: line-through; }
  .url { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .st.err { color: var(--danger); }
  .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; max-width: 420px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .acts { display: flex; gap: 6px; flex: none; }
  .acts .btn { padding: 4px 10px; font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main class="page wide">
  <h1><svg viewBox="0 0 16 16"><path d="M8 2.5v7.2M4.8 6.8 8 10l3.2-3.2M2.8 11.5v1a1 1 0 0 0 1 1h8.4a1 1 0 0 0 1-1v-1"/></svg>Stiahnuté súbory</h1>
  <div class="tools">
    <input id="search" type="search" placeholder="Hľadať v stiahnutých súboroch" spellcheck="false" autocomplete="off">
    <button id="folder" class="btn">Otvoriť priečinok</button>
    <button id="clear" class="btn danger">Vymazať zoznam</button>
  </div>
  <div class="card"><div id="list"></div></div>
  <p class="hint" id="dir"></p>
</main>
<div class="toast" id="toast"></div>
<script src="downloads.js"></script>
</body>
</html>
